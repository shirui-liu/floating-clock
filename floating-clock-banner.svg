<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="Floating Clock animated preview">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2B5CFF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#00A39A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="22%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="white" stop-opacity="1"/>
      <stop offset="78%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="streamMask">
      <rect x="640" y="10" width="160" height="300" fill="url(#fadeMask)"/>
    </mask>
    <style>
      .g {
        font-family: 'Outfit', 'SF Pro Display', 'Segoe UI Light', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 200;
        font-size: 92px;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .p { opacity: 0.88; }
      @keyframes f0 { 0%,100% { transform: translate(0,-6px) rotate(-6deg); } 50% { transform: translate(4px,8px) rotate(-2deg); } }
      @keyframes f1 { 0%,100% { transform: translate(2px,8px) rotate(5deg); } 50% { transform: translate(-3px,-6px) rotate(9deg); } }
      @keyframes f2 { 0%,100% { transform: translate(0,-3px) rotate(-3deg); } 50% { transform: translate(2px,5px) rotate(1deg); } }
      @keyframes f3 { 0%,100% { transform: translate(-2px,-9px) rotate(7deg); } 50% { transform: translate(3px,7px) rotate(3deg); } }
      @keyframes f4 { 0%,100% { transform: translate(2px,9px) rotate(-7deg); } 50% { transform: translate(-3px,-7px) rotate(-3deg); } }
      @keyframes f5 { 0%,100% { transform: translate(0,-2px) rotate(4deg); } 50% { transform: translate(-2px,6px) rotate(0deg); } }
      @keyframes f6 { 0%,100% { transform: translate(-2px,-7px) rotate(6deg); } 50% { transform: translate(3px,8px) rotate(2deg); } }
      @keyframes roll {
        0%   { transform: translate(0, 0px); }
        100% { transform: translate(0, -900px); }
      }
      @keyframes sway {
        0%,100% { transform: translateX(-8px) rotate(-5deg); }
        50%     { transform: translateX(10px) rotate(6deg); }
      }
      .d0 { animation: f0 6.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation: f1 5.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d2 { animation: f2 6.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d3 { animation: f3 5.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d4 { animation: f4 5.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d5 { animation: f5 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d6 { animation: f6 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .stream { animation: roll 10s linear infinite; }
      .sway { animation: sway 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .caption {
        font-family: 'Outfit', 'Segoe UI', Arial, sans-serif;
        font-weight: 300;
        font-size: 13px;
        letter-spacing: 2.2px;
        fill: rgba(255,255,255,0.42);
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="960" height="320" rx="18" fill="#000000"/>
  <rect width="960" height="320" rx="18" fill="url(#glow)"/>

  <g>
    <text class="g d0" x="240" y="160">0</text>
    <text class="g d1" x="315" y="160">1</text>
    <text class="g p d2" x="372" y="154">:</text>
    <text class="g d3" x="430" y="160">3</text>
    <text class="g d4" x="506" y="160">8</text>
    <text class="g p d5" x="562" y="164">.</text>
    <text class="g d6" x="622" y="160">2</text>
  </g>

  <g mask="url(#streamMask)">
    <g class="sway">
      <g class="stream">
        <text class="g" x="712" y="70">9</text>
        <text class="g" x="712" y="160">0</text>
        <text class="g" x="712" y="250">1</text>
        <text class="g" x="712" y="340">2</text>
        <text class="g" x="712" y="430">3</text>
        <text class="g" x="712" y="520">4</text>
        <text class="g" x="712" y="610">5</text>
        <text class="g" x="712" y="700">6</text>
        <text class="g" x="712" y="790">7</text>
        <text class="g" x="712" y="880">8</text>
        <text class="g" x="712" y="970">9</text>
        <text class="g" x="712" y="1060">0</text>
        <text class="g" x="712" y="1150">1</text>
      </g>
    </g>
  </g>

  <text class="caption" x="480" y="294">FLOATING CLOCK · CLICK FOR LIVE FULLSCREEN DEMO</text>
</svg>
