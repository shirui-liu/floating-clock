<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Floating Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .hint {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 200;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.38);
    pointer-events: none;
    transition: opacity 0.6s ease;
    opacity: 0;
  }
  body.show-hint { cursor: default; }
  body.show-hint .hint { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Click or press F for fullscreen</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const CARRY_HALF = 1.6;
  const PALETTE = [
    [0x2B, 0x5C, 0xFF],
    [0x00, 0xA3, 0x9A],
    [0x8A, 0x3F, 0xFC],
    [0xE0, 0x66, 0x1B],
    [0xD6, 0x33, 0x6C],
  ];
  const GLOW_CYCLE_SEC = 60;

  const FREQ_Y = [0.72, 0.86, 0.64, 0.91, 0.78, 0.69, 0.83];
  const FREQ_X = [0.48, 0.57, 0.43, 0.53, 0.61, 0.49, 0.55];
  const FREQ_R = [0.37, 0.44, 0.33, 0.47, 0.39, 0.35, 0.42];
  const PHASE  = [0.0, 1.4, 2.7, 3.9, 5.1, 0.9, 2.3];
  const BASE_Y = [-7, 8, -3, -10, 9, -4, -8];
  const BASE_R = [-6.5, 5.5, -3.0, 7.0, -7.5, 4.0, 6.0];

  let W = 0, H = 0, dpr = 1;
  const tStart = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function digit(secInt, col) {
    const v = col < 2 ? Math.floor(secInt / 3600)
            : col < 4 ? Math.floor(secInt / 60) % 60
            : secInt % 60;
    return (col & 1) === 0 ? Math.floor(v / 10) : v % 10;
  }

  function carryState(col, sec) {
    const s0 = Math.floor((sec + 86400 - CARRY_HALF) % 86400);
    const s1 = Math.floor((sec + CARRY_HALF) % 86400);
    const d0 = digit(s0, col);
    const d1 = digit(s1, col);
    if (d0 === d1) return { carrying: false, from: d0, to: d0, p: 0 };
    let u = ((sec + CARRY_HALF) % 10) / (CARRY_HALF * 2);
    u = Math.max(0, Math.min(1, u));
    const p = u * u * u * (u * (u * 6 - 15) + 10);
    return { carrying: true, from: d0, to: d1, p };
  }

  function drawGlow(t) {
    const pos = (t / GLOW_CYCLE_SEC) % PALETTE.length;
    const i0 = Math.floor(pos);
    const i1 = (i0 + 1) % PALETTE.length;
    const f = pos - i0;
    const r = Math.round(PALETTE[i0][0] + (PALETTE[i1][0] - PALETTE[i0][0]) * f);
    const g = Math.round(PALETTE[i0][1] + (PALETTE[i1][1] - PALETTE[i0][1]) * f);
    const b = Math.round(PALETTE[i0][2] + (PALETTE[i1][2] - PALETTE[i0][2]) * f);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const rad = Math.max(W, H) * 0.55;
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, rad);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.22)`);
    grad.addColorStop(0.5, `rgba(${r},${g},${b},0.07)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawGlyph(ch, x, y, deg, alpha) {
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((deg * Math.PI) / 180);
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }

  function frame(nowPerf) {
    const t = (nowPerf - tStart) * 0.001;
    drawGlow(t);

    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const sc = now.getSeconds();
    const frac = now.getMilliseconds() * 0.001;
    const sec = h * 3600 + m * 60 + sc + frac;

    const unit = Math.min(W / 1280, H / 720);
    const sz = Math.max(42, 128 * unit);
    const dp = unit * 1.35;
    const step = sz * 0.98;
    const fadeR = step * 2.75;
    const carryTravel = sz * 1.55;

    ctx.font = `200 ${sz}px 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const dw = sz * 0.68;
    const pw = dw * 0.58;
    const streamGap = dw * 0.16;
    const totalW = dw * 6 + pw * 2 + streamGap;

    const driftX = Math.sin(t * 0.025) * W * 0.045;
    const driftY = Math.sin(t * 0.018 + 1.1) * H * 0.035;
    let x = (W - totalW) * 0.5 + driftX + dw * 0.5;
    const cy = H * 0.5 + driftY;

    for (let i = 0; i < 7; i++) {
      const bx = x + Math.cos(t * FREQ_X[i] + PHASE[i]) * 4.5 * dp;
      const by = cy + BASE_Y[i] * dp + Math.sin(t * FREQ_Y[i] + PHASE[i]) * 9 * dp;
      const br = BASE_R[i] + Math.sin(t * FREQ_R[i] + PHASE[i]) * 3.8;

      if (i % 3 === 2) {
        drawGlyph(i === 2 ? ':' : '.', bx, by - (i === 2 ? sz * 0.05 : 0), br, 0.92);
      } else {
        const col = i - Math.floor(i / 3);
        const st = carryState(col, sec);
        if (!st.carrying) {
          drawGlyph(String(st.from), bx, by, br, 1);
        } else {
          const p = st.p;
          drawGlyph(String(st.from), bx - Math.sin(p * Math.PI) * 9.9 * dp, by - p * carryTravel, br - p * 9.5, 1 - p);
          drawGlyph(String(st.to), bx + Math.sin((1 - p) * Math.PI) * 9.9 * dp, by + (1 - p) * carryTravel, br + (1 - p) * 9.5, p);
        }
      }
      x += (i % 3 !== 0) ? (dw + pw) * 0.5 : dw;
    }

    const sx = x + streamGap;
    for (let k = -3; k <= 4; k++) {
      const dy = (k - frac) * step;
      const n = Math.abs(dy) / fadeR;
      if (n >= 1) continue;
      const a = Math.max(0, 1 - Math.pow(n, 1.2));
      const arg = (dy / step) * 0.85 - t * 0.88;
      drawGlyph(
        String((sc + k + 10) % 10),
        sx + Math.sin(arg) * 16 * dp,
        cy + dy,
        Math.cos(arg) * 10.5,
        a
      );
    }

    requestAnimationFrame(frame);
  }

  let hintTimer;
  function nudgeHint() {
    document.body.classList.add('show-hint');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => document.body.classList.remove('show-hint'), 2200);
  }
  window.addEventListener('mousemove', nudgeHint);
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  window.addEventListener('click', toggleFullscreen);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  document.fonts.ready.then(() => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
